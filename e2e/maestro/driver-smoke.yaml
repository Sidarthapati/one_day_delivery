# Maestro smoke for the Godspeed driver app (React Native / Android).
# Launch -> login -> land on today's work screen -> open the recommended stop (if any).
# A fast "does the app boot, auth, and route render" check — no parcel state required.
#
# Run:  maestro test e2e/maestro/driver-smoke.yaml --env EMAIL=... --env PASSWORD=...
# The DA work screen shows tab "Route" and in-body header "Today" (shuttle/van show "Today"
# tab + "Shuttle"/"Van" header) — the old Home/Pickups/Deliveries/Van tabs are gone.
appId: com.oneday.driver
---
- runFlow:
    file: subflows/login.yaml
    env:
      EMAIL: "${EMAIL}"
      PASSWORD: "${PASSWORD}"
# Dismiss the "Keep location running" background-tracking prompt that pops on the work screen.
- tapOn:
    text: "LATER"
    optional: true
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 30000
- tapOn:
    id: "open-next-stop"
    optional: true
