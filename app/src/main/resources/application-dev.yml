# Shared TEAM-TESTING broker — managed RabbitMQ on CloudAMQP.
# Activate with:  SPRING_PROFILES_ACTIVE=dev
# Secrets come from env vars (see .env, which is gitignored) — never commit real keys.
#
#   export CLOUDAMQP_URL='amqps://<user>:<pass>@<host>.rmq.cloudamqp.com/<vhost>'
#
# The amqps:// scheme makes Spring enable TLS (port 5671) and the trailing /<vhost> sets the
# CloudAMQP virtual host. The same `addresses` property serves the local Docker broker (plain
# amqp://guest:guest@localhost:5672) when CLOUDAMQP_URL is unset — switching brokers is ENV-ONLY.
spring:
  rabbitmq:
    addresses: ${CLOUDAMQP_URL}

# M9 freight consolidator — local dev reads a consolidator_mock schema in the same local Postgres
# as spring.datasource (a dev convenience). The base application.yml deliberately has NO fallback,
# so cloud envs must set CONSOLIDATOR_DATASOURCE_* explicitly. Override here via env if desired.
consolidator:
  datasource:
    url: ${CONSOLIDATOR_DATASOURCE_URL:jdbc:postgresql://localhost:5432/oneday?currentSchema=consolidator_mock}
    username: ${CONSOLIDATOR_DATASOURCE_USERNAME:oneday}
    password: ${CONSOLIDATOR_DATASOURCE_PASSWORD:secret}

# Receiver accept/reject landing page — local convenience default (the base application.yml has none,
# so cloud envs must set CUSTOMER_LANDING_BASE_URL explicitly). Override via env if desired.
orders:
  delivery:
    customer-landing-base-url: ${CUSTOMER_LANDING_BASE_URL:http://localhost:3000}
