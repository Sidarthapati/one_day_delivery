name: E2E (Postgres)

# Runs the @Tag("e2e") suites (auth/orders/dispatch) against a real Postgres — the tests that CI's
# main build skips (`-DexcludedGroups=e2e`). Manual for now: see ops/ci/README.md for why it's not
# yet on the PR gate (the module e2e tests use ddl-auto=validate against a PRE-EXISTING full schema,
# and a from-scratch DB currently trips the V1_12-before-V10 migration ordering issue — so this job
# loads a committed schema baseline instead of building the schema from zero).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: E2E against Postgres 16
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          # trust auth so both sets of test creds (oneday/oneday and oneday/secret) connect — the
          # module test ymls disagree on the password; trust makes the value irrelevant.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: oneday
          POSTGRES_DB: oneday
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U oneday"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Load schema baseline
        # The baseline is a full pg_dump (schema + flyway_schema_history) of a cleanly-migrated DB,
        # so the module-scoped Flyway runs find their migrations already recorded (no-op) and
        # ddl-auto=validate has a schema to validate against. Absent = job can't run yet (blocker).
        run: |
          if [ ! -f ops/ci/schema-baseline.sql ]; then
            echo "::error::ops/ci/schema-baseline.sql missing — see ops/ci/README.md (migration-ordering prerequisite). Skipping e2e."
            exit 1
          fi
          PGPASSWORD=ignored psql -h localhost -U oneday -d oneday -v ON_ERROR_STOP=1 -f ops/ci/schema-baseline.sql

      - name: Run e2e-tagged tests
        run: mvn install -Dgroups=e2e --batch-mode --no-transfer-progress

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-surefire-reports
          path: '**/target/surefire-reports/*.xml'
          if-no-files-found: ignore
          retention-days: 14
